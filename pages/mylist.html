    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Title</th>
            </tr>
        </thead>
        <tbody id="movieListTableBody"></tbody>
    </table>
    <button onclick="clearMyList()" class="clear-button">Clear My
        List</button><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>

    <script>
        function clearMyList() { // Declares a function named clearMyList
            localStorage.removeItem('myList'); // Removes the item with the key 'myList' from the browser's local storage
            displayMyList(); // Calls the displayMyList function to update the displayed movie list
        }


        function displayMyList() { // הגדרת פונקצייה בשם דיספליימייליסט
            const myList = JSON.parse(localStorage.getItem('myList')) || [];
            // this command takes it from local storage and send it to the table.[]= it determines that mylist is an array.
            const tableBody = document.getElementById('movieListTableBody'); // Get the table body element by its ID
            tableBody.innerHTML = myList.length > 0 ? 
            // If myList has items, it populates the table with movie titles; otherwise, it displays a message indicating that the list is empty
                myList.map((title, index) => `<tr><td>${index + 1}</td><td>${title}</td></tr>`).join('') :
                // generates HTML table rows for each movie title in myList
                '<tr><td colspan="2">My List is empty.</td></tr>';
            // If the list is empty, display a message indicating that the list is empty
        }

        displayMyList(); // מפעיל את הפונקציה האחראית להצגת רשימת הסרטים בעמוד.
    </script>
